name: enterprise level CI CD for testing
on:
  push:
    branches: 
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflow/qa_ci-cd.yaml

jobs:
  gitleak-scan:
    name: GitLeak Scan 
    run on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Run gitlicks scan 
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:repo" \
            zricethevzav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-pat=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
      

  
